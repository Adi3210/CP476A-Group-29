<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ticketing System | Create Ticket</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Create Ticket</h1>
    <nav class="nav">
      <a href="./dashboard.html">Back to Dashboard</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <form id="createTicketForm">
        <label>
          Title
          <input type="text" name="title" required placeholder="Short summary" />
        </label>

        <label>
          Description
          <textarea name="description" rows="5" required placeholder="Describe the issue..."></textarea>
        </label>

        <div class="grid2">
          <label>
            Priority
            <select name="priority" required>
              <option value="">Select</option>
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
            </select>
          </label>

          <label>
            Category
            <select name="category" required>
              <option value="">Select</option>
              <option>Bug</option>
              <option>Request</option>
              <option>Support</option>
            </select>
          </label>
        </div>

        <button class="btn primary" type="submit">Create (Mock)</button>
      </form>

      <p class="muted">Demo: submitting returns to dashboard (mock).</p>
    </section>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
