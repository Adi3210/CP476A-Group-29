<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ticketing System | Ticket Details</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Ticket Details</h1>
    <nav class="nav">
      <a href="./dashboard.html">Back to Dashboard</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2 id="ticketTitle">Ticket Details</h2>
      <p id="ticketMeta" class="muted"></p>

      <h3>Description</h3>
      <p id="ticketDesc" class="muted"></p>

      <h3>Comments</h3>
      <ul id="commentsList" class="comments"></ul>

      <form id="addCommentForm">
        <label>
          Name
          <input type="text" name="author" required placeholder="Your name" />
        </label>
        <label>
          Comment
          <textarea name="message" rows="3" required placeholder="Write a comment..."></textarea>
        </label>
        <p id="commentError" class="error" hidden></p>
        <button class="btn primary" type="submit">Add Comment</button>
      </form>
    </section>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
